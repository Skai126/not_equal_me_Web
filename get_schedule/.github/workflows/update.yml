name: スケジュール自動更新ロボット

on:
  schedule:
    # 毎日 日本時間の夜中0時（UTCで15時）に実行する
    - cron: "0 15 * * *"
  workflow_dispatch: # 手動で動かすボタンも作っておく

jobs:
  update-schedule:
    runs-on: ubuntu-latest

    # ★ロボットが data.json を上書きできるようにする許可証
    permissions:
      contents: write

    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: ツールをインストール
        run: npm install

      - name: スケジュール取得スクリプトを実行
        run: node test.js

      - name: 変更をコミットしてプッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "🤖 スケジュールを自動更新しました" || echo "変更はありません"
          git push
