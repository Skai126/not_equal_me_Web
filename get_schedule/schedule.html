<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>スケジュール - ≠ME Fan Portal</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body id="top">
    <header>
      <a
        href="https://skai126.github.io/not_equal_me_Web/index.html"
        class="site-logo"
        >≠ME Fan Portal</a
      >
    </header>

    <button
      class="hamburger"
      id="hamburger"
      onclick="toggleMenu()"
      aria-label="メニュー"
    >
      ≠
    </button>

    <nav class="nav-menu" id="nav-menu">
      <a href="../index.html">🏠 トップページ</a>
      <a href="../lyrics.html">🎤 歌割り集</a>
      <a href="../call.html">📣 コール集 (準備中)</a>
    </nav>

    <div class="page-content">
      <a
        href="https://skai126.github.io/not_equal_me_Web/index.html"
        class="back-link"
        >← トップページに戻る</a
      >
      <h1>≠ME スケジュール</h1>
      <button class="jump-btn" onclick="jumpToToday()">
        📍 今日の予定までジャンプ
      </button>

      <div class="filter-area">
        <div class="filter-section">
          <span class="filter-label"
            >▼ 年で絞り込み
            <button class="clear-btn" onclick="clearFilter('year')">
              全解除
            </button></span
          >
          <div id="year-filters" class="pill-group"></div>
        </div>
        <p></p>
        <div class="filter-section">
          <span class="filter-label"
            >▼ 月で絞り込み
            <button class="clear-btn" onclick="clearFilter('month')">
              全解除
            </button></span
          >
          <div id="month-filters" class="pill-group"></div>
        </div>
        <p></p>
        <div class="filter-section">
          <span class="filter-label"
            >▼ カテゴリで絞り込み
            <button class="clear-btn" onclick="clearFilter('category')">
              全解除
            </button></span
          >
          <div id="cat-filters" class="pill-group"></div>
        </div>
      </div>

      <button class="download-all-btn" onclick="downloadAllIcs()">
        📥 絞り込んだ予定を一括登録 (.ics)
      </button>
      <div id="loading">スケジュールを読み込み中...⏳</div>
      <ul class="schedule-list" id="schedule-list"></ul>
    </div>

    <a href="#top" class="back-to-top">↑</a>

    <script>
      let allEvents = [],
        currentFilteredEvents = [];

      function jumpToToday() {
        const todayStr = new Date()
          .toISOString()
          .split("T")[0]
          .replace(/-/g, "/");
        const items = document.querySelectorAll(".schedule-item");
        for (let item of items) {
          const dateText = item.querySelector(".schedule-date").textContent;
          if (dateText >= todayStr) {
            item.scrollIntoView({ behavior: "smooth", block: "center" });
            item.style.border = "3px solid #ff6b81";
            setTimeout(() => {
              item.style.border = "";
            }, 2000);
            break;
          }
        }
      }

      function clearFilter(name) {
        document
          .querySelectorAll(`input[name="${name}"]`)
          .forEach((cb) => (cb.checked = false));
        filterEvents();
      }

      async function loadSchedule() {
        try {
          const response = await fetch("data.json");
          allEvents = await response.json();
          const years = new Set(),
            months = new Set(),
            cats = new Set();
          allEvents.forEach((e) => {
            const [y, m] = e.yearMonth.split("/");
            years.add(y);
            months.add(m);
            if (e.category && e.category !== "情報なし") cats.add(e.category);
          });

          const createPills = (id, name, values, suffix) => {
            const container = document.getElementById(id);
            values.sort().forEach((v) => {
              const label = document.createElement("label");
              label.className = "pill-label";
              let display =
                name === "year" || name === "month"
                  ? parseInt(v, 10) + suffix
                  : v;
              label.innerHTML = `<input type="checkbox" name="${name}" value="${v}" onchange="filterEvents()">
                                 <span class="pill-text">${display}</span>`;
              container.appendChild(label);
            });
          };

          createPills("year-filters", "year", Array.from(years), "年");
          createPills("month-filters", "month", Array.from(months), "月");
          createPills("cat-filters", "category", Array.from(cats), "");
          filterEvents();
          document.getElementById("loading").style.display = "none";
        } catch (e) {
          document.getElementById("loading").innerText = "エラー: " + e.message;
        }
      }

      function filterEvents() {
        const getVals = (name) =>
          Array.from(
            document.querySelectorAll(`input[name="${name}"]:checked`),
          ).map((cb) => cb.value);
        const y = getVals("year"),
          m = getVals("month"),
          c = getVals("category");
        const today = new Date();
        const nextWeek = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);

        currentFilteredEvents = allEvents.filter((e) => {
          const [ey, em] = e.yearMonth.split("/");
          return (
            (y.length === 0 || y.includes(ey)) &&
            (m.length === 0 || m.includes(em)) &&
            (c.length === 0 || c.includes(e.category))
          );
        });

        const list = document.getElementById("schedule-list");
        list.innerHTML = "";
        currentFilteredEvents.forEach((e) => {
          const li = document.createElement("li");
          const [dY, dM, dD] = e.date.split("/").map(Number);
          const evDate = new Date(dY, dM - 1, dD);
          li.className =
            evDate >= today && evDate <= nextWeek
              ? "schedule-item is-soon"
              : "schedule-item";
          li.innerHTML = `<div class="schedule-date">${e.date} ${evDate >= today && evDate <= nextWeek ? '<span class="soon-label">まもなく！</span>' : ""}</div>
                          <div class="schedule-cat">${e.category}</div>
                          <div class="schedule-title">${e.url ? `<a href="${e.url}" target="_blank">${e.title}</a>` : e.title}</div>`;
          list.appendChild(li);
        });
      }

      function downloadAllIcs() {
        if (currentFilteredEvents.length === 0)
          return alert("予定がありません！");
        let ics =
          "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//NoimeFanPortal//JP\n";
        currentFilteredEvents.forEach((e) => {
          const d = e.date.split("/");
          ics += `BEGIN:VEVENT\nDTSTART;VALUE=DATE:${d.join("")}\nSUMMARY:[${e.category}] ${e.title}\nEND:VEVENT\n`;
        });
        ics += "END:VCALENDAR";
        const blob = new Blob([ics], { type: "text/calendar" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "schedule.ics";
        link.click();
      }

      function toggleMenu() {
        // ハンバーガーボタンとメニューに 'active' という状態を付け外しする
        document.getElementById("hamburger").classList.toggle("active");
        document.getElementById("nav-menu").classList.toggle("active");
      }

      window.onload = loadSchedule;
    </script>
  </body>
</html>
