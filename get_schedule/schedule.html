<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>スケジュール - ≠ME Fan Portal</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      /* 基本デザインは前回同様 */
      .schedule-list {
        list-style: none;
        padding: 0;
      }
      .schedule-item {
        background: #ffffff;
        margin-bottom: 15px;
        padding: 15px 20px;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        display: flex;
        align-items: center;
        border-left: 5px solid #ffb6c1;
        flex-wrap: wrap;
      }
      .schedule-date {
        font-weight: bold;
        color: #ffb6c1;
        font-size: 1.1em;
        margin-right: 15px;
        white-space: nowrap;
      }
      .schedule-cat {
        background: #00dca0;
        color: white;
        font-size: 0.8em;
        font-weight: bold;
        padding: 4px 10px;
        border-radius: 20px;
        margin-right: 15px;
        white-space: nowrap;
      }
      .schedule-title {
        color: #555;
        font-weight: bold;
        line-height: 1.4;
        flex-grow: 1;
      }
      .schedule-title a {
        color: #ff6b81;
        text-decoration: none;
      }

      .download-all-btn {
        display: block;
        background: #ff6b81;
        color: white;
        text-align: center;
        text-decoration: none;
        font-size: 1.1em;
        font-weight: bold;
        padding: 12px 20px;
        border-radius: 30px;
        margin-bottom: 20px;
        cursor: pointer;
        border: none;
        width: 100%;
      }

      .filter-area {
        background: #fff0f5;
        padding: 15px 20px;
        border-radius: 10px;
        margin-bottom: 20px;
      }
      .filter-section {
        margin-bottom: 15px;
      }
      .filter-label {
        font-weight: bold;
        color: #ff6b81;
        margin-bottom: 8px;
        font-size: 0.9em;
        display: block;
      }
      .pill-group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .pill-label input[type="checkbox"] {
        display: none;
      }
      .pill-text {
        display: inline-block;
        padding: 6px 14px;
        background: white;
        border: 1px solid #ffb6c1;
        border-radius: 20px;
        color: #555;
        font-size: 0.9em;
        font-weight: bold;
        cursor: pointer;
      }
      .pill-label input[type="checkbox"]:checked + .pill-text {
        background: #ffb6c1;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="page-content">
      <h1>📅 スケジュール帳</h1>

      <div class="filter-area">
        <div class="filter-section">
          <span class="filter-label">▼ 年</span>
          <div id="year-filters" class="pill-group"></div>
        </div>
        <div class="filter-section">
          <span class="filter-label">▼ 月（複数選択可）</span>
          <div id="month-filters" class="pill-group"></div>
        </div>
        <div class="filter-section">
          <span class="filter-label">▼ カテゴリ</span>
          <div id="cat-filters" class="pill-group"></div>
        </div>
      </div>

      <button class="download-all-btn" onclick="downloadAllIcs()">
        📥 絞り込み結果を一括登録 (.ics)
      </button>
      <ul class="schedule-list" id="schedule-list"></ul>
    </div>

    <script>
      let allEvents = [],
        currentFilteredEvents = [];

      async function loadSchedule() {
        const response = await fetch("../data.json");
        allEvents = await response.json();

        const years = new Set(),
          months = new Set(),
          cats = new Set();
        allEvents.forEach((e) => {
          const parts = e.date.split("/");
          years.add(parts[0]);
          months.add(parts[1]);
          if (e.category) cats.add(e.category);
        });

        function createPills(id, name, values, suffix) {
          const container = document.getElementById(id);
          values.forEach((v) => {
            const label = document.createElement("label");
            label.className = "pill-label";
            label.innerHTML = `<input type="checkbox" name="${name}" value="${v}" onchange="filterEvents()">
                               <span class="pill-text">${parseInt(v, 10)}${suffix}</span>`;
            container.appendChild(label);
          });
        }

        createPills("year-filters", "year", Array.from(years).sort(), "年");
        createPills("month-filters", "month", Array.from(months).sort(), "月");
        createPills("cat-filters", "category", Array.from(cats), "");
        filterEvents();
      }

      function filterEvents() {
        const getVals = (name) =>
          Array.from(
            document.querySelectorAll(`input[name="${name}"]:checked`),
          ).map((cb) => cb.value);
        const y = getVals("year"),
          m = getVals("month"),
          c = getVals("category");

        currentFilteredEvents = allEvents.filter((e) => {
          const p = e.date.split("/");
          return (
            (y.length === 0 || y.includes(p[0])) &&
            (m.length === 0 || m.includes(p[1])) &&
            (c.length === 0 || c.includes(e.category))
          );
        });

        const list = document.getElementById("schedule-list");
        list.innerHTML = "";
        currentFilteredEvents.forEach((e) => {
          const li = document.createElement("li");
          li.className = "schedule-item";
          li.innerHTML = `<div class="schedule-date">${e.date}</div>
                          <div class="schedule-cat">${e.category}</div>
                          <div class="schedule-title">${e.url ? `<a href="${e.url}" target="_blank">${e.title}</a>` : e.title}</div>`;
          list.appendChild(li);
        });
      }

      function downloadAllIcs() {
        // (以前の downloadAllIcs 関数をそのまま使用)
        if (currentFilteredEvents.length === 0) return alert("予定なし！");
        let ics = "BEGIN:VCALENDAR\nVERSION:2.0\n";
        currentFilteredEvents.forEach((e) => {
          const d = e.date.split("/");
          ics += `BEGIN:VEVENT\nDTSTART;VALUE=DATE:${d.join("")}\nSUMMARY:[${e.category}] ${e.title}\nEND:VEVENT\n`;
        });
        ics += "END:VCALENDAR";
        const blob = new Blob([ics], { type: "text/calendar" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "schedule.ics";
        link.click();
      }
      window.onload = loadSchedule;
    </script>
  </body>
</html>
